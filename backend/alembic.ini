[alembic]
script_location = alembic
prepend_sys_path = .
# Bağlantı dizesi burada tutulmaz; alembic/env.py DATABASE_URL_SYNC (yoksa
# DATABASE_URL) ortam değişkeninden okur. backend/.env dosyasına yazın.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
